name: Optimize hero image

on:
  push:
    branches:
      - refactor/clean-baseline
    paths:
      - ".github/workflows/optimize-hero.yml"
      - "assets/photos/approved-photo.png"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/clean-baseline

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Sharp
        run: npm install --no-save sharp@0.34.4

      - name: Generate production hero assets
        run: |
          node <<'NODE'
          const sharp = require("sharp");

          const source = "assets/photos/approved-photo.png";

          async function run() {
            const image = sharp(source).flatten({ background: "#ffffff" });

            await image
              .clone()
              .avif({ quality: 60, effort: 6 })
              .toFile("assets/photos/hero-gte.avif");

            await image
              .clone()
              .webp({ quality: 82, effort: 6 })
              .toFile("assets/photos/hero-gte.webp");

            await image
              .clone()
              .jpeg({ quality: 88, progressive: true, mozjpeg: true })
              .toFile("assets/photos/hero-gte.jpg");
          }

          run().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/hero-gte.avif assets/photos/hero-gte.webp assets/photos/hero-gte.jpg

          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi

          git commit -m "perf: add optimized hero image formats"
          git push origin HEAD:refactor/clean-baseline
